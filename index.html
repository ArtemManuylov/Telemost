<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Инструкция Яндекс Телемост</title>
    <!-- Подключаем стиль AsciiDoc -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/asciidoctor.js/1.5.9/css/asciidoctor.min.css">
    <style>
        /* ===== ГЛОБАЛЬНЫЕ СТИЛИ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.7;
            padding: 40px 20px;
        }

        .doc {
            max-width: 900px;
            margin: 0 auto;
            background: #161b22;
            padding: 50px 60px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid #30363d;
        }

        /* ===== ЗАГОЛОВКИ ===== */
        h1 {
            font-size: 32px;
            font-weight: 700;
            color: #f0f6fc;
            border-bottom: 3px solid #58a6ff;
            padding-bottom: 12px;
            margin-bottom: 30px;
            letter-spacing: -0.3px;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            color: #f0f6fc;
            margin-top: 40px;
            margin-bottom: 18px;
            padding-left: 14px;
            border-left: 4px solid #58a6ff;
        }

        h3 {
            font-size: 20px;
            font-weight: 600;
            color: #f0f6fc;
            margin-top: 28px;
            margin-bottom: 14px;
        }

        /* ===== ПАРАГРАФЫ И ТЕКСТ ===== */
        p {
            margin-bottom: 12px;
            color: #c9d1d9;
        }

        /* ===== СПИСКИ ===== */
        ol, ul {
            padding-left: 24px;
            margin-bottom: 16px;
            color: #c9d1d9;
        }

        ol li, ul li {
            margin-bottom: 6px;
        }

        /* ===== ЖИРНЫЙ ===== */
        strong {
            color: #f0f6fc;
            font-weight: 600;
        }

        /* ===== КУРСИВ ===== */
        em {
            color: #8b949e;
            font-style: italic;
        }

        /* ===== ССЫЛКИ ===== */
        a {
            color: #58a6ff;
            text-decoration: none;
            border-bottom: 1px dotted #58a6ff;
        }

        a:hover {
            color: #79c0ff;
            border-bottom: 1px solid #79c0ff;
        }

        /* ===== КАРТИНКИ ===== */
        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 16px 0 20px 0;
            border-radius: 10px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            background: #0d1117;
        }

        /* ===== ПРИМЕЧАНИЯ (NOTE) ===== */
        .admonitionblock {
            background: #1c2333;
            border-left: 4px solid #58a6ff;
            border-radius: 8px;
            padding: 14px 20px;
            margin: 20px 0;
            color: #c9d1d9;
        }

        .admonitionblock .icon {
            font-weight: 700;
            color: #58a6ff;
            margin-right: 8px;
        }

        .admonitionblock .content {
            display: inline;
        }

        /* ===== КОД И МОНОШИРИННЫЙ ТЕКСТ ===== */
        code, .monospaced {
            font-family: 'SF Mono', 'JetBrains Mono', 'Cascadia Code', monospace;
            background: #0d1117;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #e6edf3;
            border: 1px solid #30363d;
        }

        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            .doc {
                padding: 24px 18px;
            }
            h1 {
                font-size: 26px;
            }
            h2 {
                font-size: 20px;
            }
            h3 {
                font-size: 18px;
            }
        }

        /* ===== СКРОЛЛ ДЛЯ ДЛИННЫХ БЛОКОВ ===== */
        pre {
            background: #0d1117;
            padding: 14px 18px;
            border-radius: 8px;
            overflow-x: auto;
            border: 1px solid #30363d;
            color: #c9d1d9;
            font-family: 'SF Mono', 'JetBrains Mono', monospace;
            font-size: 0.9em;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <!-- Здесь будет отображаться ваша инструкция -->
    <div id="content"></div>

    <!-- Подключаем JavaScript-конвертер AsciiDoc -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/asciidoctor.js/1.5.9/asciidoctor.min.js"></script>
    <script>
        
        var asciidocText = `
:note-caption: Примечание

= Инструкция создание звонка в Яндекс Телемост

== Установка приложения 

1. Откройте браузер и перейдите на официальный сайт https://telemost.yandex.ru/[Яндекс Телемост].

2. На главной странице в правом нижнем углу нажмите кнопку **Скачать для Windows**
+
image::img/main_page.png[width=500]

NOTE: если вы используете другую операционную систему выберите соответствующий вариант: macOS или мобильное приложение.

3. В открывшемся диалоговом окне браузера укажите папку для сохранения установочного файла и нажмите кнопку **«Сохранить»**.

4. Запустите скачанный установочный файл. 

5. Операционная система запросит _разрешение на внесение изменений на устройстве_ , нажмите **«Да»**.

6. По завершении установки приложение Яндекс Телемост откроется автоматически.

== Авторизация в сервисе

В правом верхнем углу главной страницы нажмите кнопку **«Войти»**.

image::img/telemost.png[width=500]

В открывшемся окне выберите способ авторизации по почте или телефону.

   * **По телефону** — введите номер  и нажмите кнопку **«Далее»**.
+
image::img/phone.png[width=500]

   * введите код из СМС-сообщения или push-уведомления, которое пришло на ваше устройство.
+
image::img/sms_code.png[width=500]

   * **По электронной почте** — введите адрес вашей почты.
+
image::img/mail.png[width=500]
+
   * Введите пароль от вашего аккаунта Яндекс и нажмите кнопку **«Далее»**.
+
image::img/password.png[width=500]
+
   * Затем введите код из  push-уведомления или СМС-сообщения которое пришло на ваше устройство.
+
image::img/push_code.png[width=500]

После успешной авторизации вы будете перенаправлены на главную страницу сервиса.

NOTE: если у вас нет учётной записи Яндекс ID, нажмите кнопку **«Создать ID»** в окне авторизации и следуйте инструкциям на экране для создания нового аккаунта.

== Создание встречи

1. На главном экране нажмите кнопку «Создать встречу».
+
image::img/create_button.png[width=500]
+
2. В открывшемся окне в левом нижнем углу нажмите кнопку «Скопировать ссылку».
+
image::img/link.png[width=500]
+
3. Отправьте полученную ссылку другим участникам любым удобным способом.

4. Когда другие участники перейдут по ссылке и подключатся, встреча начнётся. В интерфейсе отобразится список подключившихся участников.
+
image::img/video_meeting.png[width=500]

== Настройки 

Для перехода в настройки нажмите в правом нижнем углу главного окна кнопку **«Настройки»** . Откроется окно с вкладками: **«Аккаунт»**, **«Звук»**, **«Видео»**.

image::img/settings.png[width=500]

=== Настройка аккаунта

1. В окне настроек перейдите на вкладку **«Аккаунт»**.

2. Нажмите кнопку **«Редактировать»**.
+
image::img/account_settings.png[width=500]
+
3. В открывшемся окне отобразятся все данные, указанные ранее в настройках профиля Яндекса.

4. Измените имя или изображение профиля и нажмите кнопку **«Сохранить»**
+
image::img/data_settings.png[width=500]

=== Настройка звука

1. В окне настроек перейдите на вкладку **«Звук»**.

2. Для проверки работоспособности устройств нажмите конрпку **«Проверить»**:

   * Для микрофона — приложение запишет звук в течение 5 секунд, после чего автоматически воспроизведёт запись;

   * Для динамиков — воспроизведётся тестовая мелодия.

3. С помощью тумблеров настройте следующие параметры:

   * Включать микрофон при подключении;
   
   * Шумоподавление.

+
image::img/sound_settings.png[width=500]

=== Настройка видео

1. В окне настроек перейдите на вкладку **«Видео»**.

2. С помощью тумблеров настройте следующие параметры:

   * Подключаться с включённой камерой;

   * Показывать себя на встрече;

   * Скрыть видео участников.

+
image::img/Video_settings.png[width=500]
        `;

        // Конвертируем AsciiDoc в HTML и вставляем на страницу
        var html = Asciidoctor().convert(asciidocText);
        document.getElementById('content').innerHTML = html;
    </script>
</body>
</html>
